<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Who's that Eevee?</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a1a;
      color: #d4d4d4;
      font-family: sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .page-wrapper {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    #navbar {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 1.75rem;
    }

    #back-btn {
      background: none;
      border: 1px solid #444;
      border-radius: 6px;
      color: #888;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.4rem 1rem;
      transition: border-color 0.2s, color 0.2s;
    }

    #back-btn:hover {
      border-color: #777;
      color: #d4d4d4;
    }

    h1 {
      font-size: 1.4rem;
      color: #f0f0f0;
      margin-bottom: 2rem;
    }

    .section {
      background-color: #242424;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .section h2 {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1.1rem;
    }

    /* --- Avatar preview --- */
    .avatar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    #avatar-preview {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: #3a3a3a;
      border: 2px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #ccc;
      overflow: hidden;
      flex-shrink: 0;
    }

    #avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .pfp-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Hidden real file input */
    #pfp-input {
      display: none;
    }

    /* --- Shared field styles --- */
    label {
      display: block;
      font-size: 0.85rem;
      color: #a0a0a0;
      margin-bottom: 0.35rem;
    }

    input[type="text"] {
      width: 100%;
      background-color: #2e2e2e;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.85rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #777;
    }

    .hint {
      font-size: 0.8rem;
      color: #555;
      margin-bottom: 0.85rem;
    }

    /* --- Buttons --- */
    button {
      background-color: #3a3a3a;
      color: #f0f0f0;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 0.5rem 1.1rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    button:hover:not(:disabled) {
      background-color: #4e4e4e;
      border-color: #888;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-danger {
      background: none;
      border-color: #5a2a2a;
      color: #a05050;
    }

    .btn-danger:hover:not(:disabled) {
      background-color: #3a1a1a;
      border-color: #a05050;
      color: #d47070;
    }

    .status-msg {
      font-size: 0.82rem;
      min-height: 1.1em;
      margin-top: 0.5rem;
    }

    .status-ok  { color: #5a9a5a; }
    .status-err { color: #c0392b; }

    .section-divider {
      border: none;
      border-top: 1px solid #333;
      margin: 1.25rem 0;
    }

    .subsection-label {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      margin-bottom: 0.85rem;
    }

    .pw-field {
      position: relative;
      margin-bottom: 0.75rem;
    }

    .pw-field input {
      width: 100%;
      background-color: #2e2e2e;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.6rem 2.5rem 0.6rem 0.75rem;
      margin-bottom: 0;
    }

    .pw-field input:focus {
      outline: none;
      border-color: #777;
    }

    .eye-btn {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      padding: 0.2rem;
      display: flex;
      align-items: center;
      line-height: 1;
    }

    .eye-btn:hover:not(:disabled) {
      background: none;
      border: none;
      color: #aaa;
    }

    .delete-account-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .delete-account-wrap p {
      font-size: 0.85rem;
      color: #666;
      line-height: 1.4;
    }

    /* --- Confirmation modal --- */
    #confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    #confirm-overlay.visible {
      display: flex;
    }

    #confirm-modal {
      background-color: #242424;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
    }

    #confirm-modal h3 {
      font-size: 1.1rem;
      color: #f0f0f0;
      margin-bottom: 0.75rem;
    }

    #confirm-modal p {
      font-size: 0.9rem;
      color: #888;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    #confirm-modal p strong {
      color: #c0392b;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    #cancel-delete-btn {
      background: none;
      border-color: #444;
      color: #888;
    }

    #cancel-delete-btn:hover:not(:disabled) {
      border-color: #777;
      color: #d4d4d4;
      background: none;
    }

    #confirm-delete-btn {
      background-color: #5a1a1a;
      border-color: #a05050;
      color: #d47070;
    }

    #confirm-delete-btn:hover:not(:disabled) {
      background-color: #7a2a2a;
      border-color: #d47070;
      color: #f0a0a0;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="navbar">
      <button id="back-btn">← Back</button>
    </div>

    <h1>Settings</h1>

    <!-- Profile picture -->
    <div class="section">
      <h2>Profile Picture</h2>
      <div class="avatar-wrap">
        <div id="avatar-preview"></div>
        <div class="pfp-actions">
          <button id="choose-pfp-btn">Choose Image</button>
          <button id="remove-pfp-btn" class="btn-danger">Remove</button>
        </div>
      </div>
      <input type="file" id="pfp-input" accept="image/*" />
      <p class="status-msg" id="pfp-status"></p>
    </div>

    <!-- Account settings -->
    <div class="section">
      <h2>Account Settings</h2>

      <!-- Display name -->
      <h3 class="subsection-label">Display Name</h3>
      <p class="hint">Displayed separately from your login username</p>
      <input type="text" id="screen-name-input" maxlength="100" placeholder="Enter a display name…" />
      <button id="save-name-btn">Save</button>
      <p class="status-msg" id="name-status"></p>

      <hr class="section-divider" />

      <!-- Change password -->
      <h3 class="subsection-label">Change Password</h3>

      <div class="pw-field">
        <input type="password" id="current-pw" placeholder="Current password" autocomplete="current-password" />
        <button class="eye-btn" id="eye-current" type="button" aria-label="Show password">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="pw-field">
        <input type="password" id="new-pw" placeholder="New password" autocomplete="new-password" />
        <button class="eye-btn" id="eye-new" type="button" aria-label="Show password">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="pw-field">
        <input type="password" id="confirm-pw" placeholder="Confirm new password" autocomplete="new-password" />
        <button class="eye-btn" id="eye-confirm" type="button" aria-label="Show password">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button id="change-pw-btn">Change Password</button>
      <p class="status-msg" id="pw-status"></p>

      <hr class="section-divider" />

      <!-- Delete account -->
      <div class="delete-account-wrap">
        <p>Permanently delete your account and all associated data.</p>
        <button id="delete-account-btn" class="btn-danger">Delete Account</button>
      </div>
    </div>
  </div>

  <!-- Confirmation modal -->
  <div id="confirm-overlay">
    <div id="confirm-modal">
      <h3>Delete account?</h3>
      <p>This will permanently delete your account, your post, and all your likes. <strong>This cannot be undone.</strong></p>
      <div class="modal-actions">
        <button id="cancel-delete-btn">Cancel</button>
        <button id="confirm-delete-btn">Delete Account</button>
      </div>
    </div>
  </div>

  <script>
    const username = sessionStorage.getItem('username');
    if (!username) window.location.replace('login.html');

    // ── helpers ──────────────────────────────────────────────────────────────

    function setStatus(el, text, ok) {
      el.textContent = text;
      el.className = 'status-msg ' + (ok ? 'status-ok' : 'status-err');
    }

    function clearStatus(el) {
      el.textContent = '';
      el.className = 'status-msg';
    }

    function renderAvatar(dataUrl) {
      const el = document.getElementById('avatar-preview');
      if (dataUrl) {
        el.innerHTML = `<img src="${dataUrl}" alt="Profile picture" />`;
      } else {
        el.innerHTML = username.charAt(0).toUpperCase();
      }
    }

    // Resize image to ≤ 200×200 and return a JPEG data URL
    function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const MAX = 200;
            let { width, height } = img;
            if (width > height) {
              if (width > MAX) { height = Math.round(height * MAX / width); width = MAX; }
            } else {
              if (height > MAX) { width = Math.round(width * MAX / height); height = MAX; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ── load profile ─────────────────────────────────────────────────────────

    let pendingPfp = undefined; // undefined = not changed, null = remove, string = new data url

    async function loadProfile() {
      try {
        const res = await fetch(`/.netlify/functions/get-profile?username=${encodeURIComponent(username)}`);
        const data = await res.json();
        renderAvatar(data.profilePicture);
        document.getElementById('screen-name-input').value = data.displayName || '';
      } catch {
        // silently ignore; avatar will show initials
        renderAvatar(null);
      }
    }

    loadProfile();

    // ── back button ───────────────────────────────────────────────────────────

    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = 'review.html';
    });

    // ── profile picture ───────────────────────────────────────────────────────

    const pfpInput   = document.getElementById('pfp-input');
    const pfpStatus  = document.getElementById('pfp-status');

    document.getElementById('choose-pfp-btn').addEventListener('click', () => {
      pfpInput.click();
    });

    pfpInput.addEventListener('change', async () => {
      const file = pfpInput.files[0];
      if (!file) return;

      clearStatus(pfpStatus);
      const chooseBtn = document.getElementById('choose-pfp-btn');
      chooseBtn.disabled = true;
      chooseBtn.textContent = 'Processing…';

      try {
        const dataUrl = await resizeImage(file);
        pendingPfp = dataUrl;
        renderAvatar(dataUrl);

        // auto-save
        const res = await fetch('/.netlify/functions/update-profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, profilePicture: dataUrl })
        });
        if (res.ok) {
          setStatus(pfpStatus, 'Profile picture saved.', true);
          sessionStorage.setItem('profilePicture', dataUrl);
        } else {
          const d = await res.json();
          setStatus(pfpStatus, d.error || 'Failed to save.', false);
        }
      } catch {
        setStatus(pfpStatus, 'Error processing image.', false);
      } finally {
        chooseBtn.disabled = false;
        chooseBtn.textContent = 'Choose Image';
        pfpInput.value = '';
      }
    });

    document.getElementById('remove-pfp-btn').addEventListener('click', async () => {
      clearStatus(pfpStatus);
      const removeBtn = document.getElementById('remove-pfp-btn');
      removeBtn.disabled = true;

      try {
        const res = await fetch('/.netlify/functions/update-profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, profilePicture: null })
        });
        if (res.ok) {
          renderAvatar(null);
          sessionStorage.removeItem('profilePicture');
          setStatus(pfpStatus, 'Profile picture removed.', true);
        } else {
          const d = await res.json();
          setStatus(pfpStatus, d.error || 'Failed to remove.', false);
        }
      } catch {
        setStatus(pfpStatus, 'Network error.', false);
      } finally {
        removeBtn.disabled = false;
      }
    });

    // ── screen name ───────────────────────────────────────────────────────────

    const nameStatus = document.getElementById('name-status');

    document.getElementById('save-name-btn').addEventListener('click', async () => {
      clearStatus(nameStatus);
      const saveBtn = document.getElementById('save-name-btn');
      const val = document.getElementById('screen-name-input').value;

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';

      try {
        const res = await fetch('/.netlify/functions/update-profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, displayName: val })
        });
        const data = await res.json();
        if (res.ok) {
          sessionStorage.setItem('displayName', val.trim());
          setStatus(nameStatus, 'Screen name saved.', true);
        } else {
          setStatus(nameStatus, data.error || 'Failed to save.', false);
        }
      } catch {
        setStatus(nameStatus, 'Network error.', false);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
      }
    });

    // ── change password ───────────────────────────────────────────────────────

    const EYE_OPEN = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const EYE_OFF  = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

    function setupEyeToggle(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn   = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        const hidden = input.type === 'password';
        input.type   = hidden ? 'text' : 'password';
        btn.innerHTML = hidden ? EYE_OFF : EYE_OPEN;
        btn.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
      });
    }

    setupEyeToggle('current-pw', 'eye-current');
    setupEyeToggle('new-pw',     'eye-new');
    setupEyeToggle('confirm-pw', 'eye-confirm');

    const pwStatus = document.getElementById('pw-status');

    document.getElementById('change-pw-btn').addEventListener('click', async () => {
      const currentPw = document.getElementById('current-pw').value;
      const newPw     = document.getElementById('new-pw').value;
      const confirmPw = document.getElementById('confirm-pw').value;

      if (!currentPw || !newPw || !confirmPw) {
        setStatus(pwStatus, 'Please fill out all password fields.', false);
        return;
      }

      if (newPw !== confirmPw) {
        setStatus(pwStatus, 'New passwords do not match.', false);
        return;
      }

      if (newPw.length < 6) {
        setStatus(pwStatus, 'New password must be at least 6 characters.', false);
        return;
      }

      clearStatus(pwStatus);
      const changeBtn = document.getElementById('change-pw-btn');
      changeBtn.disabled = true;
      changeBtn.textContent = 'Saving…';

      try {
        const res = await fetch('/.netlify/functions/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, currentPassword: currentPw, newPassword: newPw })
        });
        const data = await res.json();
        if (res.ok) {
          setStatus(pwStatus, 'Password changed successfully.', true);
          document.getElementById('current-pw').value = '';
          document.getElementById('new-pw').value     = '';
          document.getElementById('confirm-pw').value = '';
        } else {
          setStatus(pwStatus, data.error || 'Failed to change password.', false);
        }
      } catch {
        setStatus(pwStatus, 'Network error.', false);
      } finally {
        changeBtn.disabled = false;
        changeBtn.textContent = 'Change Password';
      }
    });

    // ── delete account ────────────────────────────────────────────────────────

    const overlay = document.getElementById('confirm-overlay');

    document.getElementById('delete-account-btn').addEventListener('click', () => {
      overlay.classList.add('visible');
    });

    document.getElementById('cancel-delete-btn').addEventListener('click', () => {
      overlay.classList.remove('visible');
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('visible');
    });

    document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
      const confirmBtn = document.getElementById('confirm-delete-btn');
      const cancelBtn = document.getElementById('cancel-delete-btn');
      confirmBtn.disabled = true;
      cancelBtn.disabled = true;
      confirmBtn.textContent = 'Deleting…';

      try {
        const res = await fetch('/.netlify/functions/delete-account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });

        if (res.ok) {
          sessionStorage.clear();
          document.getElementById('confirm-modal').innerHTML = `
            <p style="text-align:center;color:#d4d4d4;font-size:1rem;line-height:1.7;padding:0.5rem 0;">
              Account deleted successfully.<br>Redirecting to home page...
            </p>
          `;
          setTimeout(() => { window.location.href = 'index.html'; }, 2500);
        } else {
          const data = await res.json();
          confirmBtn.disabled = false;
          cancelBtn.disabled = false;
          confirmBtn.textContent = 'Delete Account';
          overlay.classList.remove('visible');
          const nameStatus = document.getElementById('name-status');
          setStatus(nameStatus, data.error || 'Failed to delete account.', false);
        }
      } catch {
        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
        confirmBtn.textContent = 'Delete Account';
        overlay.classList.remove('visible');
        setStatus(document.getElementById('name-status'), 'Network error.', false);
      }
    });
  </script>
</body>
</html>
